name: CI/CD

# Thin trigger. All behavior lives in `dev workflow`, which is mode-aware from
# GITHUB_EVENT_NAME (and SYNC_ICONS for manual dispatch).
#
# Trusted Publishing on nuget.org is bound to this workflow file — do not add a
# second job that publishes outside `dev workflow`; schedule/sync must still go
# through the workflow endpoint so the OIDC identity matches the trusted path.
#
# Modes:
#   push/PR            -> clean -> build -> test
#   release            -> clean -> build -> pack -> push
#   schedule / sync    -> update-icons --push --publish

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'releases.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'source/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'releases.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sync_icons:
        description: 'Sync icons from upstream simple-icons and publish if updated'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 0'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      # write needed when workflow mode is Sync (commit/push icon updates)
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (OIDC Trusted Publishing)
        if: >-
          github.event_name == 'release' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.sync_icons)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Run CI Pipeline
        env:
          # workflow command reads this for workflow_dispatch + sync path
          SYNC_ICONS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_icons) }}
        run: |
          API_KEY="${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          if [ -n "$API_KEY" ]; then
            dotnet run tools/dev-cli/dev.cs -- workflow --api-key "$API_KEY"
          else
            dotnet run tools/dev-cli/dev.cs -- workflow
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: ignore
